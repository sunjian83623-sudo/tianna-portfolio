<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 孙剑 AIGC 作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>
  <!-- 密码登录遮罩 -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-avatar"></div>
      <h2 class="auth-title">管理后台</h2>
      <p class="auth-subtitle">请输入管理密码</p>
      <input id="authPassword" type="password" class="auth-input" placeholder="管理密码" autocomplete="current-password" />
      <button id="authSubmit" type="button" class="btn btn--primary auth-submit">登录</button>
      <p id="authError" class="auth-error"></p>
      <a href="index.html" class="auth-back">← 返回站点</a>
    </div>
  </div>

  <header class="admin-topbar">
    <div class="admin-topbar__brand">
      <a href="index.html" class="admin-topbar__back">← 返回站点</a>
      <h1>管理后台</h1>
    </div>
    <div class="admin-topbar__actions">
      <span id="saveStatus" class="save-status"></span>
      <button id="btnSave" type="button" class="btn btn--primary">保存</button>
      <button id="btnPreview" type="button" class="btn">预览</button>
      <button id="btnExport" type="button" class="btn">导出 JSON</button>
      <label class="btn" for="importFile">导入 JSON</label>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
      <button id="btnReset" type="button" class="btn btn--danger">重置默认</button>
      <button id="btnPassword" type="button" class="btn">修改密码</button>
    </div>
  </header>

  <div class="admin-layout">
    <nav class="admin-nav" id="adminNav"></nav>
    <main class="admin-main" id="adminMain">
      <div class="loading">加载配置中…</div>
    </main>
  </div>

  <input id="hiddenFileInput" type="file" accept="image/*,video/*" hidden />

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
